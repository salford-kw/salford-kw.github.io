<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>فحص الاتصال بالـ Worker</title>
<style>
body{font-family:monospace;background:#0D0D0D;color:#F9F4EC;padding:20px;line-height:1.8;font-size:15px;direction:rtl;}
h2{color:#C8A96E;}
.line{margin:10px 0;padding:10px;border-radius:8px;background:rgba(255,255,255,.05);white-space:pre-wrap;word-break:break-all;}
.ok{border-right:4px solid #1ebe52;}
.fail{border-right:4px solid #ff6b6b;}
.pending{border-right:4px solid #C8A96E;}
button{background:#C8A96E;color:#0d0d0d;border:none;padding:14px 20px;border-radius:8px;font-size:16px;font-weight:bold;width:100%;margin-top:10px;}
</style>
</head>
<body>
<h2>🔍 فحص الاتصال بالـ Worker</h2>
<div id="results"></div>
<button onclick="runTests()">▶️ ابدأ الفحص</button>

<script>
const WORKER_URL = 'https://salford-publish.hamdllalab4.workers.dev';
const results = document.getElementById('results');

function addLine(text, cls) {
  const div = document.createElement('div');
  div.className = 'line ' + cls;
  div.textContent = text;
  results.appendChild(div);
  return div;
}

async function runTests() {
  results.innerHTML = '';
  addLine('📍 نافذتك (Origin) الحالية: ' + window.location.origin, 'pending');

  // اختبار 1: GET بسيط (بدون Content-Type مخصص) — ما يحتاج CORS preflight
  const line1 = addLine('⏳ اختبار 1: طلب GET بسيط...', 'pending');
  try {
    const r1 = await fetch(WORKER_URL, { method: 'GET' });
    const t1 = await r1.text();
    line1.textContent = '✅ اختبار 1 نجح — الحالة: ' + r1.status + ' — الرد: ' + t1;
    line1.className = 'line ok';
  } catch (e) {
    line1.textContent = '❌ اختبار 1 فشل: ' + e.message + '\n\n⬅️ هذا يعني: المشكلة اتصال شبكة حقيقي (مو CORS)، لأن حتى أبسط طلب فشل قبل لا يوصل السيرفر.';
    line1.className = 'line fail';
  }

  // اختبار 2: POST بـ JSON — يفعّل CORS preflight (OPTIONS) قبله
  const line2 = addLine('⏳ اختبار 2: طلب POST مع JSON (زي add.html بالضبط)...', 'pending');
  try {
    const r2 = await fetch(WORKER_URL + '/api/publish-products', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ password: 'test-diagnostic-only', products: [] })
    });
    const t2 = await r2.text();
    line2.textContent = '✅ اختبار 2 نجح — الحالة: ' + r2.status + ' — الرد: ' + t2 + '\n\n⬅️ هذا رد طبيعي متوقع (كلمة مرور خاطئة تعمداً)، والمهم إن الطلب وصل ورجع رد. يعني CORS شغال تمام.';
    line2.className = 'line ok';
  } catch (e) {
    line2.textContent = '❌ اختبار 2 فشل: ' + e.message + '\n\n⬅️ إذا الاختبار 1 نجح لكن هذا فشل: المشكلة CORS تحديداً (الـ Worker يرفض التعرف على Origin صفحتك). إذا الاثنين فشلوا: المشكلة شبكة عامة.';
    line2.className = 'line fail';
  }

  // اختبار 3: هل /api/publish-catalog-page موجود أصلاً على الـ Worker؟
  const line3 = addLine('⏳ اختبار 3: فحص وجود /api/publish-catalog-page...', 'pending');
  try {
    const r3 = await fetch(WORKER_URL + '/api/publish-catalog-page', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ password: 'test-diagnostic-only', section: 'sataer', index: 999, html: '<p>test</p>' })
    });
    const t3 = await r3.text();
    if (r3.status === 404) {
      line3.textContent = '❌ اختبار 3: الحالة 404 — الرد: ' + t3 + '\n\n⬅️ هذا يعني: endpoint /api/publish-catalog-page غير موجود على النسخة المنشورة حالياً من worker.js على Cloudflare. لازم تحدّث الكود على لوحة Cloudflare وتعمل Deploy.';
      line3.className = 'line fail';
    } else if (r3.status === 401 || r3.status === 403) {
      line3.textContent = '✅ اختبار 3 نجح — الحالة: ' + r3.status + ' — الرد: ' + t3 + '\n\n⬅️ الـ endpoint موجود وشغال (رفض كلمة المرور الخاطئة كما هو متوقع). المشكلة إذاً بمكان ثاني غير وجود الـ endpoint.';
      line3.className = 'line ok';
    } else {
      line3.textContent = 'ℹ️ اختبار 3 — الحالة: ' + r3.status + ' — الرد: ' + t3 + '\n\n⬅️ صوّر هذا الرد وابعثه، نحتاج نقرأه بالتفصيل لمعرفة السبب بالضبط.';
      line3.className = 'line pending';
    }
  } catch (e) {
    line3.textContent = '❌ اختبار 3 فشل بالاتصال: ' + e.message;
    line3.className = 'line fail';
  }

  // اختبار 4: هل /api/write-sitemap موجود وشغال؟
  const line4 = addLine('⏳ اختبار 4: فحص وجود /api/write-sitemap...', 'pending');
  try {
    const r4 = await fetch(WORKER_URL + '/api/write-sitemap', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ password: 'test-diagnostic-only', xml: '<x/>' })
    });
    const t4 = await r4.text();
    if (r4.status === 404) {
      line4.textContent = '❌ اختبار 4: الحالة 404 — الرد: ' + t4 + '\n\n⬅️ endpoint /api/write-sitemap غير موجود على النسخة المنشورة.';
      line4.className = 'line fail';
    } else if (r4.status === 401 || r4.status === 403) {
      line4.textContent = '✅ اختبار 4 نجح — الحالة: ' + r4.status + ' — الرد: ' + t4 + '\n\n⬅️ الـ endpoint موجود وشغال.';
      line4.className = 'line ok';
    } else {
      line4.textContent = 'ℹ️ اختبار 4 — الحالة: ' + r4.status + ' — الرد: ' + t4;
      line4.className = 'line pending';
    }
  } catch (e) {
    line4.textContent = '❌ اختبار 4 فشل بالاتصال: ' + e.message;
    line4.className = 'line fail';
  }

  addLine('✅ انتهى الفحص. صوّر هذي النتائج كاملة وابعثها.', 'pending');
}
</script>
</body>
</html>
