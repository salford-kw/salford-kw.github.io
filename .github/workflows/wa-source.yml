name: WhatsApp source tag

# يضمن أن كل صفحة (حتى المنشورة من لوحة الإدارة) تضيف سطر المصدر
# «📍 سالفورد — الصفحة — المنتج» في بداية أي رسالة واتساب.
on:
  push:
    branches: [main]
    paths: ['**.html', 'scripts/wa-src.js', 'scripts/inject-wa-src.py']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: wa-source
  cancel-in-progress: false

jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Inject source tag
        run: python3 scripts/inject-wa-src.py
      - name: Commit if needed
        run: |
          git add -A
          if git diff --cached --quiet; then echo "✅ كل الصفحات فيها وسم المصدر"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "وسم مصدر واتساب للصفحات الجديدة"
          git pull --rebase origin main && git push
