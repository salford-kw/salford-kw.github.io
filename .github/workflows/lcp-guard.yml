name: Site Guard

# يشتغل عند أي تغيير بالصور أو posts.json (أي عند الإضافة/الحذف من لوحة الإدارة)
# ويمكن تشغيله يدوياً من تبويب Actions.
on:
  push:
    branches: [main]
    paths:
      - 'products/**'
      - 'posts.json'
      - '**.html'
      - 'scripts/**'
      - '.github/workflows/lcp-guard.yml'
  workflow_dispatch:

permissions:
  contents: read

# تشغيل واحد في كل مرة، حتى لا يتعارض مع تعديلات لوحة الإدارة
concurrency:
  group: lcp-guard
  cancel-in-progress: false

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install sharp
        run: npm install --no-save --no-package-lock sharp@0.33

      - name: Remove Google Tag
        run: node scripts/strip-gtag.mjs

      - name: Run LCP guard
        run: node scripts/lcp-guard.mjs

      - name: Verify site is clean
        run: |
          # فحص فقط — لا يرفع شيئاً (الفرع الرئيسي محمي).
          # لو فشل هذا الفحص فمعناه أن لوحة الإدارة أنتجت صفحة فيها Google Tag
          # أو صورة غير محسّنة، ويجب إصلاح المصدر لا ترقيع النتيجة.
          git add -A
          if git diff --cached --quiet; then
            echo "✅ الموقع نظيف"
          else
            echo "❌ ملفات تحتاج إصلاح من المصدر:"
            git diff --cached --stat
            exit 1
          fi
