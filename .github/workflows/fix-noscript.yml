name: fix-unclosed-noscript

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/fix-noscript.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Remove stray unclosed noscript tag
        run: |
          python3 - <<'EOF'
          import glob
          n = 0
          for f in glob.glob('**/*.html', recursive=True):
              if f.startswith('backups/'):
                  continue
              s = open(f, encoding='utf-8').read()
              if s.count('<noscript') > s.count('</noscript>') and '<noscript><!--' in s:
                  s = s.replace('<noscript><!--', '<!--', 1)
                  open(f, 'w', encoding='utf-8').write(s)
                  n += 1
          print('fixed', n)
          EOF

      - name: Commit and push
        run: |
          git config user.name "salford-kw"
          git config user.email "hamdllalab4@gmail.com"
          git add -A
          if git diff --cached --quiet; then
            echo "nothing to fix"
          else
            git commit -m "إصلاح الشاشة البيضاء: حذف وسم noscript المفتوح بالخطأ من صفحات الكتالوج"
            git push
          fi
