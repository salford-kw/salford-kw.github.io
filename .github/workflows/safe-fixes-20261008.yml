name: safe-fixes-20261008
on:
  push:
    branches: [main]
    paths: ['.github/workflows/safe-fixes-20261008.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Guard - site files must be identical to a0f69f5
        run: git diff --quiet a0f69f54b2f64402108d6b6047154958951d6e13 HEAD -- . ":!.github"
      - name: Apply safe SEO fixes
        run: |
          cat > /tmp/safe_fixes.py <<'PYEOF'
          import re,json,os,glob,subprocess,urllib.parse,xml.dom.minidom
          # pre-edit dates for sitemap
          out=subprocess.run(['git','-c','core.quotepath=off','log','--format=@%cs','--name-only','--','*.html'],capture_output=True,text=True).stdout
          D={};cur=None
          for l in out.splitlines():
              if l.startswith('@'): cur=l[1:]
              elif l.strip() and l not in D: D[l]=cur
          TODAY=subprocess.run(['date','+%F'],capture_output=True,text=True).stdout.strip()
          def rd(p): return open(p,encoding='utf-8').read()
          def wr(p,s): open(p,'w',encoding='utf-8').write(s)
          # 1 sataer cards
          h=rd('sataer.html'); S=json.load(open('products.json',encoding='utf-8'))['sataer']
          arts=list(re.finditer(r'<article class="product-card".*?</article>',h,re.S))
          tpl=arts[11].group(0)
          def card(it):
              stem=it['img'].replace('-small.webp','')
              img=stem+'.webp' if os.path.exists('products/'+stem.split('/products/')[-1]+'.webp') else it['img']
              a=re.sub(r"openLightbox\('[^']+'\)",lambda m:"openLightbox('%s')"%(it.get('imgLarge') or img),tpl)
              a=re.sub(r'<img src="[^"]+" alt="[^"]*"',lambda m:'<img src="%s" alt="%s - سالفورد الكويت"'%(img,it['code'].replace('"','')),a)
              a=re.sub(r'<h3>.*?</h3>',lambda m:'<h3>%s</h3>'%it['code'],a)
              a=re.sub(r'<p>.*?</p>',lambda m:'<p>%s</p>'%it['desc'],a,flags=re.S)
              return re.sub(r'href="/catalog/sataer-[^"]+\.html"',lambda m:'href="/catalog/sataer-%s.html"'%it['slug'],a)
          for i in range(17,11,-1):
              m=arts[i]; h=h[:m.start()]+card(S[i])+h[m.end():]
          arts=re.findall(r'<article class="product-card".*?</article>',h,re.S)
          assert all(re.search(r'<h3>(.*?)</h3>',arts[i]).group(1)==S[i]['code'] for i in range(18))
          wr('sataer.html',h)
          # 2 blog link
          p='blog/carpet-vs-mokeet.html'; h=rd(p)
          a='<a href="/afdal-mokeet-kuwait.html"><b>أفضل موكيت في الكويت — صفحة الخدمة الكاملة</b></a>\n'
          assert h.count(a)==1 and 'sajjad-bel-meter-kuwait.html' not in h
          wr(p,h.replace(a,a+'<a href="/sajjad-bel-meter-kuwait.html"><b>سجاد بالمتر الكويت — قص وتفصيل حسب المقاس</b></a>\n'))
          # 3 wafi description
          p='sataer-wafi-kuwait.html'; h=rd(p); o='content="ستائر ويفي بالكويت بموجات تخفي السكة:'
          assert h.count(o)==1
          wr(p,h.replace(o,'content="ستائر ويفي (ستارة ويفي) بالكويت بموجات تخفي السكة:'))
          # 4 reviews guard, 5 previews removal
          A="initProductReviews('site', 'site-reviews-mount');"
          B="const schemaEl = document.getElementById('site-reviews-schema');"
          F1="loadScriptTag('https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js')\n      .then(() => loadScriptTag('https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js'))\n      .then(() => loadScriptTag('/reviews-widget.js'))"
          F1n="(window.firebase ? Promise.resolve() : loadScriptTag('https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js'))\n      .then(() => (window.firebase && window.firebase.firestore) ? null : loadScriptTag('https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js'))\n      .then(() => (typeof window.srSubscribe === 'function') ? null : loadScriptTag('/reviews-widget.js'))"
          prev=re.compile(r'\n<script>\n// =+\n// تحديث معاينات الأقسام بالصفحة الرئيسية.*?\}\)\(\);\n</script>',re.S)
          st=[0,0]
          for p in sorted(glob.glob('*.html')):
              if p=='index.html': continue
              h=rd(p); o=h
              if A in h and F1 in h:
                  h=h.replace(A,"if (document.getElementById('site-reviews-mount')) "+A).replace(F1,F1n)
                  h=h.replace(B,B+"\n          if (!schemaEl) return;"); st[0]+=1
              if 'updateHomePreviews' in h and 'id="preview-' not in h:
                  h2,n=prev.subn('',h)
                  if n==1: h=h2; st[1]+=1
              if h!=o: wr(p,h)
          print('reviews',st[0],'previews',st[1]); assert st[0]>=30 and st[1]>=30
          # 6 sitemap
          for p in ['sataer.html','blog/carpet-vs-mokeet.html','sataer-wafi-kuwait.html']: D[p]=TODAY
          s=rd('sitemap.xml'); n=[0]
          def fix(m):
              loc,sp,lm=m.group(1),m.group(2),m.group(3)
              p=urllib.parse.unquote(loc.replace('https://salfordkw.shop/','')) or 'index.html'
              if not p.endswith('.html'): p+='.html'
              g=D.get(p)
              if g and g>lm[:10]: n[0]+=1; lm=g+lm[10:]
              return '<loc>%s</loc>%s<lastmod>%s</lastmod>'%(loc,sp,lm)
          s=re.sub(r'<loc>([^<]+)</loc>(\s*)<lastmod>([^<]+)</lastmod>',fix,s); wr('sitemap.xml',s)
          xml.dom.minidom.parse('sitemap.xml'); print('lastmod',n[0])
          # syntax check
          bad=0
          for p in subprocess.run(['git','-c','core.quotepath=off','diff','--name-only'],capture_output=True,text=True).stdout.split('\n'):
              if not p.endswith('.html'): continue
              t=rd(p)
              for m in re.finditer(r'<script type="application/ld\+json">(.*?)</script>',t,re.S): json.loads(m.group(1))
              for m in re.finditer(r'<script>(.*?)</script>',t,re.S):
                  open('/tmp/x.js','w',encoding='utf-8').write(m.group(1))
                  if subprocess.run(['node','--check','/tmp/x.js']).returncode: bad+=1; print('JS ERR',p)
          assert bad==0; print('checks ok')
          PYEOF
          python3 /tmp/safe_fixes.py
          n=$(git diff --name-only | wc -l); echo "changed files: $n"; test "$n" -eq 36
      - name: Commit
        run: |
          git config user.name "salford-kw"
          git config user.email "hamdllalab4@gmail.com"
          git add -A -- . ":!.github"
          test "$(git diff --cached --name-only | wc -l)" -eq 36
          git commit -m "إصلاحات SEO آمنة: كروت الستائر 13-18، رابط سجاد بالمتر، وصف الويفي، حماية سكربت التقييمات، حذف سكربت المعاينات من غير الرئيسية، تصحيح lastmod" -m "Co-Authored-By: Claude Opus 5.5 <noreply@anthropic.com>"
          git push origin HEAD:main
