<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>إضافة منتج سريعة | سالفورد</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" type="image/png" href="/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;900&display=swap" rel="stylesheet">
<style>
:root{--gold:#C8A96E;--gold-light:#E8D5A3;--dark:#0D0D0D;--dark2:#111008;--dark3:#1c1508;--green:#1ebe52;}
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:Tajawal,sans-serif;background:var(--dark);color:#F9F4EC;direction:rtl;min-height:100vh;line-height:1.6;}
header{background:linear-gradient(160deg,var(--dark2),var(--dark3));text-align:center;padding:22px 20px 18px;border-bottom:1px solid rgba(200,169,110,.25);}
.logo{font-size:28px;font-weight:900;color:var(--gold);}
.logo-sub{font-size:12px;color:var(--gold-light);opacity:.8;margin-top:3px;}
#login-screen{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:60px 24px;}
#login-screen h2{color:var(--gold-light);font-size:16px;margin-bottom:18px;}
.login-input{width:100%;max-width:320px;background:rgba(255,255,255,.05);border:1px solid rgba(200,169,110,.2);border-radius:10px;padding:14px 16px;font-family:Tajawal,sans-serif;font-size:16px;color:#F9F4EC;text-align:center;letter-spacing:3px;margin-bottom:14px;outline:none;}
.login-input:focus{border-color:var(--gold);}
.login-btn{width:100%;max-width:320px;background:var(--gold);color:#0d0d0d;border:none;border-radius:10px;padding:14px;font-family:Tajawal,sans-serif;font-size:16px;font-weight:700;cursor:pointer;}
#login-error{color:#ff6b6b;font-size:13px;margin-top:10px;display:none;}
#panel{display:none;padding:20px 16px 40px;max-width:480px;margin:0 auto;}
.field-group{margin-bottom:16px;}
.field-label{display:block;font-size:13px;color:var(--gold);font-weight:700;margin-bottom:7px;}
.field-input,select.field-input{width:100%;background:rgba(255,255,255,.04);border:1px solid rgba(200,169,110,.2);border-radius:10px;padding:13px 14px;font-family:Tajawal,sans-serif;font-size:15px;color:#F9F4EC;outline:none;}
.field-input:focus{border-color:var(--gold);}
textarea.field-input{resize:none;height:80px;line-height:1.6;}
.price-row{display:flex;gap:10px;}
.price-row .field-group{flex:1;}
.img-upload-area{position:relative;border:2px dashed rgba(200,169,110,.3);border-radius:14px;padding:26px 16px;text-align:center;background:rgba(200,169,110,.04);}
.img-upload-area input[type=file]{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%;}
.img-upload-area .icon{font-size:34px;margin-bottom:8px;}
.img-upload-area .txt{font-size:13px;color:rgba(200,169,110,.6);}
.img-upload-area .hint{font-size:11px;color:rgba(200,169,110,.35);margin-top:4px;}
#img-preview-grid{display:none;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px;}
.img-thumb{position:relative;aspect-ratio:1;border-radius:10px;overflow:hidden;border:1px solid rgba(200,169,110,.2);}
.img-thumb img{width:100%;height:100%;object-fit:cover;display:block;}
.img-thumb .cover-badge{position:absolute;top:4px;right:4px;background:rgba(200,169,110,.9);color:#0d0d0d;font-size:9px;font-weight:800;padding:2px 6px;border-radius:6px;}
.img-thumb .rm-btn{position:absolute;top:4px;left:4px;background:rgba(0,0,0,.7);color:#ff6b6b;border:none;border-radius:50%;width:22px;height:22px;font-size:14px;line-height:1;cursor:pointer;display:flex;align-items:center;justify-content:center;}
.img-count{font-size:11px;color:rgba(200,169,110,.5);margin-top:6px;text-align:center;}
.video-tabs{display:flex;gap:8px;margin-bottom:10px;}
.video-tab{flex:1;background:rgba(255,255,255,.04);border:1px solid rgba(200,169,110,.2);color:rgba(249,244,236,.6);border-radius:10px;padding:10px;font-family:Tajawal,sans-serif;font-size:13px;font-weight:700;cursor:pointer;text-align:center;}
.video-tab.active{background:rgba(200,169,110,.15);border-color:var(--gold);color:var(--gold-light);}
.video-panel{display:none;}
.video-panel.active{display:block;}
#video-preview-wrap{display:none;margin-top:10px;}
#video-preview-wrap video{width:100%;border-radius:10px;border:1px solid rgba(200,169,110,.2);max-height:200px;}
.btn-submit{width:100%;background:linear-gradient(135deg,var(--green),#128c3e);color:#fff;border:none;border-radius:12px;padding:17px;font-family:Tajawal,sans-serif;font-size:17px;font-weight:800;cursor:pointer;margin-top:8px;}
.btn-submit:disabled{opacity:.5;}
#status-msg{text-align:center;font-size:13px;margin-top:14px;color:rgba(200,169,110,.7);min-height:18px;}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#1c1508;border:1px solid var(--gold);color:#F9F4EC;padding:12px 22px;border-radius:10px;font-size:14px;z-index:9999;display:none;box-shadow:0 6px 24px rgba(0,0,0,.5);max-width:90%;text-align:center;}
.token-row{margin-bottom:18px;padding:12px;background:rgba(200,169,110,.05);border-radius:10px;border:1px solid rgba(200,169,110,.15);}
.token-row.hide{display:none;}
.token-row label{font-size:12px;color:rgba(200,169,110,.6);display:block;margin-bottom:6px;}
.token-row input{width:100%;background:transparent;border:1px solid rgba(200,169,110,.2);border-radius:8px;padding:9px 10px;color:#F9F4EC;font-family:monospace;font-size:12px;}
</style>
</head>
<body>
<header>
  <div class="logo">➕ إضافة منتج سريعة</div>
  <div class="logo-sub">سالفورد للأثاث والمفروشات</div>
</header>

<div id="login-screen">
  <h2>🔒 أدخل كلمة المرور</h2>
  <input type="password" class="login-input" id="pwd-input" placeholder="••••••••" onkeydown="if(event.key==='Enter')checkLogin()">
  <button class="login-btn" onclick="checkLogin()">دخول</button>
  <div id="login-error">❌ كلمة مرور خاطئة</div>
</div>

<div id="panel">
  <div class="token-row" id="token-row">
    <label>🔑 GitHub Token (مرة وحدة بس، يُحفظ بهذا الجهاز)</label>
    <input type="password" id="gh-token-input" placeholder="ghp_xxxxxxxxxxxxxxxxxxxx">
    <button class="login-btn" style="margin-top:8px;padding:10px;font-size:13px;" onclick="saveToken()">حفظ التوكن</button>
  </div>

  <div class="field-group">
    <label class="field-label">📸 صور المنتج (يمكن اختيار أكثر من صورة دفعة وحدة)</label>
    <div class="img-upload-area" id="upload-area">
      <div class="icon">📷</div>
      <div class="txt">اضغط لاختيار صورة أو عدة صور</div>
      <div class="hint">حتى 8 صور — كل صورة أقصى 6MB — تُضغط تلقائياً قبل الرفع</div>
      <input type="file" id="img-file" accept="image/*" multiple onchange="handleImageSelect(this)">
    </div>
    <div id="img-preview-grid"></div>
    <div class="img-count" id="img-count-txt"></div>
  </div>

  <div class="field-group">
    <label class="field-label">🎬 فيديو المنتج (اختياري)</label>
    <div class="video-tabs">
      <button type="button" class="video-tab active" id="tab-novideo" onclick="setVideoMode('none')">بدون فيديو</button>
      <button type="button" class="video-tab" id="tab-upload" onclick="setVideoMode('upload')">رفع ملف</button>
      <button type="button" class="video-tab" id="tab-url" onclick="setVideoMode('url')">رابط فيديو</button>
    </div>
    <div class="video-panel" id="panel-upload">
      <div class="img-upload-area" id="video-upload-area">
        <div class="icon">🎥</div>
        <div class="txt">اضغط لاختيار فيديو من جهازك</div>
        <div class="hint">أقصى حجم 20MB — MP4 يُفضّل</div>
        <input type="file" id="video-file" accept="video/*" onchange="handleVideoSelect(this)">
      </div>
    </div>
    <div class="video-panel" id="panel-url">
      <input type="text" class="field-input" id="video-url-input" placeholder="رابط يوتيوب أو رابط فيديو مباشر" oninput="previewVideoUrl()">
    </div>
    <div id="video-preview-wrap"><video id="video-preview" controls muted playsinline></video></div>
  </div>

  <div class="field-group">
    <label class="field-label">📂 القسم</label>
    <select class="field-input" id="section-select">
      <option value="sajjad">🧶 سجاد وموكيت</option>
      <option value="majalis">🏠 مجالس ومساند</option>
      <option value="athath">🛋️ أثاث وديكور</option>
      <option value="sataer">🪟 ستائر</option>
    </select>
  </div>

  <div class="field-group">
    <label class="field-label">✏️ اسم المنتج</label>
    <input type="text" class="field-input" id="name-input" placeholder="مثال: سجاد تركي كود 13">
  </div>

  <div class="price-row">
    <div class="field-group">
      <label class="field-label">💰 السعر (د.ك)</label>
      <input type="text" class="field-input" id="price-input" placeholder="مثلاً 5.500">
    </div>
    <div class="field-group">
      <label class="field-label">الوحدة</label>
      <select class="field-input" id="unit-select">
        <option value="م">بالمتر</option>
        <option value="قطعة">بالقطعة</option>
        <option value="متر مربع">بالمتر المربع</option>
      </select>
    </div>
  </div>

  <div class="field-group">
    <label class="field-label">📝 ملاحظات / وصف</label>
    <textarea class="field-input" id="notes-input" placeholder="أي تفاصيل عن المنتج، الخامة، الألوان المتوفرة..."></textarea>
  </div>

  <div class="field-group" style="display:flex;align-items:center;gap:10px;background:rgba(200,169,110,.05);border:1px solid rgba(200,169,110,.15);border-radius:10px;padding:13px 14px;">
    <input type="checkbox" id="also-work-checkbox" checked style="width:20px;height:20px;accent-color:#C8A96E;flex-shrink:0;">
    <label for="also-work-checkbox" style="font-size:13px;color:rgba(249,244,236,.8);margin:0;">📸 انشره أيضاً بقسم "آخر أعمالنا"</label>
  </div>

  <button class="btn-submit" id="submit-btn" onclick="submitProduct()">➕ إضافة المنتج فوراً</button>
  <div id="status-msg"></div>
</div>

<div class="toast" id="toast"></div>

<script>
const PASS = 'hamad2012';
const GH_OWNER = 'salford-kw';
const GH_REPO  = 'salford-kw.github.io';
const GH_BRANCH = 'main';
const MAX_IMAGES = 8;
let selectedImages = [];   // [{file, dataUrl}]
let selectedVideoFile = null;
let videoMode = 'none';

function checkLogin() {
  const val = document.getElementById('pwd-input').value;
  if (val === PASS) {
    document.getElementById('login-screen').style.display = 'none';
    document.getElementById('panel').style.display = 'block';
    checkTokenStatus();
  } else {
    document.getElementById('login-error').style.display = 'block';
    document.getElementById('pwd-input').value = '';
    setTimeout(()=>document.getElementById('login-error').style.display='none', 2000);
  }
}
function getToken() { return localStorage.getItem('gh_token') || ''; }
function saveToken() {
  const t = document.getElementById('gh-token-input').value.trim();
  if (!t) return;
  localStorage.setItem('gh_token', t);
  document.getElementById('gh-token-input').value = '';
  checkTokenStatus();
  showToast('✅ تم حفظ التوكن');
}
function checkTokenStatus() {
  const row = document.getElementById('token-row');
  row.classList.toggle('hide', !!getToken());
}

// ===== Images (multiple) =====
const COMPRESS_MAX_DIM = 1600;   // أقصى بُعد (طول/عرض) للصورة بعد الضغط
const COMPRESS_QUALITY = 0.8;    // جودة الضغط (0-1)

// يفحص إن كان المتصفح يدعم تصدير WebP فعلياً (وليس فقط قراءته)
function supportsWebpExport() {
  const c = document.createElement('canvas');
  c.width = c.height = 1;
  return c.toDataURL('image/webp').indexOf('data:image/webp') === 0;
}
const CAN_EXPORT_WEBP = supportsWebpExport();

// يضغط صورة عبر canvas: يعيد تحجيمها لأقصى بُعد COMPRESS_MAX_DIM ويحوّلها WebP
// (أو JPEG كبديل للمتصفحات القديمة) بجودة COMPRESS_QUALITY، دون تعديل يدوي من المستخدم.
function compressImage(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = e => {
      const img = new Image();
      img.onload = () => {
        let { width, height } = img;
        if (width > COMPRESS_MAX_DIM || height > COMPRESS_MAX_DIM) {
          if (width > height) { height = Math.round(height * COMPRESS_MAX_DIM / width); width = COMPRESS_MAX_DIM; }
          else { width = Math.round(width * COMPRESS_MAX_DIM / height); height = COMPRESS_MAX_DIM; }
        }
        const canvas = document.createElement('canvas');
        canvas.width = width; canvas.height = height;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, width, height);
        const mime = CAN_EXPORT_WEBP ? 'image/webp' : 'image/jpeg';
        const ext = CAN_EXPORT_WEBP ? 'webp' : 'jpg';
        const dataUrl = canvas.toDataURL(mime, COMPRESS_QUALITY);
        canvas.toBlob(blob => {
          if (!blob) { reject(new Error('فشل ضغط الصورة')); return; }
          const baseName = file.name.replace(/\.[^.]+$/, '');
          const compressedFile = new File([blob], `${baseName}.${ext}`, { type: mime });
          resolve({ compressedFile, dataUrl });
        }, mime, COMPRESS_QUALITY);
      };
      img.onerror = () => reject(new Error('تعذّرت قراءة الصورة'));
      img.src = e.target.result;
    };
    reader.onerror = () => reject(new Error('تعذّرت قراءة الملف'));
    reader.readAsDataURL(file);
  });
}

async function handleImageSelect(input) {
  const files = Array.from(input.files || []);
  for (const file of files) {
    if (selectedImages.length >= MAX_IMAGES) { showToast(`⚠️ الحد الأقصى ${MAX_IMAGES} صور`, '#ff6b6b'); break; }
    if (file.size > 6 * 1024 * 1024) { showToast(`⚠️ صورة "${file.name}" أكبر من 6MB`, '#ff6b6b'); continue; }
    try {
      setStatus('🗜️ جاري ضغط الصورة...');
      const { compressedFile, dataUrl } = await compressImage(file);
      selectedImages.push({ file: compressedFile, dataUrl });
      renderImageGrid();
    } catch (e) {
      // في حال فشل الضغط لأي سبب، تُستخدم الصورة الأصلية بدل فقدانها بالكامل
      await new Promise(resolve => {
        const reader = new FileReader();
        reader.onload = ev => { selectedImages.push({ file, dataUrl: ev.target.result }); renderImageGrid(); resolve(); };
        reader.onerror = resolve;
        reader.readAsDataURL(file);
      });
    } finally {
      setStatus('');
    }
  }
  input.value = '';
}
function removeImage(idx) {
  selectedImages.splice(idx, 1);
  renderImageGrid();
}
function renderImageGrid() {
  const grid = document.getElementById('img-preview-grid');
  const countTxt = document.getElementById('img-count-txt');
  if (selectedImages.length === 0) {
    grid.style.display = 'none';
    countTxt.textContent = '';
    return;
  }
  grid.style.display = 'grid';
  grid.innerHTML = selectedImages.map((img, i) => `
    <div class="img-thumb">
      ${i === 0 ? '<span class="cover-badge">غلاف</span>' : ''}
      <img src="${img.dataUrl}">
      <button type="button" class="rm-btn" onclick="removeImage(${i})">✕</button>
    </div>
  `).join('');
  countTxt.textContent = `${selectedImages.length} من ${MAX_IMAGES} صور — الصورة الأولى هي الغلاف`;
}

// ===== Video =====
// يلتقط أول لقطة (فريم) من فيديو مرفوع محلياً ويحوّلها لصورة مضغوطة
// تُستخدم كصورة غلاف تلقائية عند رفع فيديو بدون أي صور مرفقة.
function generateVideoThumbnail(file) {
  return new Promise((resolve, reject) => {
    const url = URL.createObjectURL(file);
    const video = document.createElement('video');
    video.src = url;
    video.muted = true;
    video.playsInline = true;
    video.onloadeddata = () => {
      // نأخذ اللقطة من الثانية 0.3 (تفادي فريم أسود بالبداية أحياناً)
      try { video.currentTime = Math.min(0.3, (video.duration || 1) / 2); }
      catch (e) { captureFrame(); }
    };
    video.onseeked = captureFrame;
    video.onerror = () => { URL.revokeObjectURL(url); reject(new Error('تعذّرت قراءة الفيديو لالتقاط صورة الغلاف')); };

    function captureFrame() {
      try {
        const canvas = document.createElement('canvas');
        canvas.width = video.videoWidth || 400;
        canvas.height = video.videoHeight || 400;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
        const mime = CAN_EXPORT_WEBP ? 'image/webp' : 'image/jpeg';
        const ext = CAN_EXPORT_WEBP ? 'webp' : 'jpg';
        canvas.toBlob(blob => {
          URL.revokeObjectURL(url);
          if (!blob) { reject(new Error('فشل استخراج صورة الغلاف من الفيديو')); return; }
          const baseName = file.name.replace(/\.[^.]+$/, '');
          const thumbFile = new File([blob], `${baseName}-cover.${ext}`, { type: mime });
          resolve(thumbFile);
        }, mime, COMPRESS_QUALITY);
      } catch (e) { URL.revokeObjectURL(url); reject(e); }
    }
  });
}
function setVideoMode(mode) {
  videoMode = mode;
  document.getElementById('tab-novideo').classList.toggle('active', mode === 'none');
  document.getElementById('tab-upload').classList.toggle('active', mode === 'upload');
  document.getElementById('tab-url').classList.toggle('active', mode === 'url');
  document.getElementById('panel-upload').classList.toggle('active', mode === 'upload');
  document.getElementById('panel-url').classList.toggle('active', mode === 'url');
  if (mode !== 'upload') { selectedVideoFile = null; document.getElementById('video-file').value = ''; }
  if (mode !== 'url') { document.getElementById('video-url-input').value = ''; }
  if (mode === 'none') { document.getElementById('video-preview-wrap').style.display = 'none'; }
}
function handleVideoSelect(input) {
  const file = input.files[0];
  if (!file) return;
  if (file.size > 20 * 1024 * 1024) { showToast('⚠️ الفيديو أكبر من 20MB', '#ff6b6b'); input.value = ''; return; }
  selectedVideoFile = file;
  const url = URL.createObjectURL(file);
  const vp = document.getElementById('video-preview');
  vp.src = url;
  document.getElementById('video-preview-wrap').style.display = 'block';
}
function previewVideoUrl() {
  const url = document.getElementById('video-url-input').value.trim();
  const wrap = document.getElementById('video-preview-wrap');
  const vp = document.getElementById('video-preview');
  if (!url) { wrap.style.display = 'none'; return; }
  if (/youtube\.com|youtu\.be/.test(url)) {
    wrap.style.display = 'none'; // handled on display pages via embed, no local preview for youtube here
    return;
  }
  vp.src = url;
  wrap.style.display = 'block';
}

function fileToBase64(file) {
  return new Promise((resolve, reject) => {
    const r = new FileReader();
    r.onload = () => resolve(r.result.split(',')[1]);
    r.onerror = reject;
    r.readAsDataURL(file);
  });
}

function showToast(msg, color) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.style.borderColor = color || '#C8A96E';
  t.style.display = 'block';
  setTimeout(()=>t.style.display='none', 3400);
}
function setStatus(msg) { document.getElementById('status-msg').textContent = msg; }

async function ghApi(path, method, body) {
  const token = getToken();
  const url = `https://api.github.com/repos/${GH_OWNER}/${GH_REPO}/contents/${path}`;
  const res = await fetch(url, {
    method: method || 'GET',
    headers: {
      'Authorization': `token ${token}`,
      'Accept': 'application/vnd.github.v3+json',
      ...(body ? {'Content-Type': 'application/json'} : {})
    },
    body: body ? JSON.stringify(body) : undefined
  });
  const data = await res.json();
  if (!res.ok && res.status !== 404) throw new Error(data.message || 'خطأ بالاتصال مع GitHub');
  return { ok: res.ok, status: res.status, data };
}

async function uploadFileToGitHub(file, folder, prefix) {
  const ts = Date.now() + '_' + Math.random().toString(36).slice(2,7);
  const ext = (file.name.split('.').pop() || 'jpg').toLowerCase();
  const filename = `${prefix}_${ts}.${ext}`;
  const path = `${folder}/${filename}`;
  const base64 = await fileToBase64(file);
  const r = await ghApi(path, 'PUT', { message: `رفع ملف: ${filename}`, content: base64, branch: GH_BRANCH });
  if (!r.ok) throw new Error(r.data.message || 'فشل رفع الملف');
  return `https://salfordkw.shop/${path}`;
}

function genProductId() {
  return 'prod_' + Date.now() + '_' + Math.random().toString(36).slice(2,7);
}

async function submitProduct() {
  const token = getToken();
  if (!token) { showToast('⚠️ أدخل GitHub Token أولاً بالأعلى', '#ff6b6b'); return; }
  const hasVideo = (videoMode === 'upload' && selectedVideoFile) || (videoMode === 'url' && document.getElementById('video-url-input').value.trim());
  if (selectedImages.length === 0 && !hasVideo) { showToast('⚠️ ارفق صورة واحدة على الأقل أو فيديو', '#ff6b6b'); return; }
  const name = document.getElementById('name-input').value.trim();
  if (!name) { showToast('⚠️ أدخل اسم المنتج', '#ff6b6b'); return; }
  const section = document.getElementById('section-select').value;
  const price = document.getElementById('price-input').value.trim();
  const unit = document.getElementById('unit-select').value;
  const notes = document.getElementById('notes-input').value.trim();

  const btn = document.getElementById('submit-btn');
  btn.disabled = true;

  try {
    const imageUrls = [];

    if (selectedImages.length > 0) {
      setStatus(`📤 جاري رفع الصور (0/${selectedImages.length})...`);
      for (let i = 0; i < selectedImages.length; i++) {
        const url = await uploadFileToGitHub(selectedImages[i].file, 'products', 'product');
        imageUrls.push(url);
        setStatus(`📤 جاري رفع الصور (${i+1}/${selectedImages.length})...`);
      }
    } else if (videoMode === 'upload' && selectedVideoFile) {
      // ما فيه صور مرفقة لكن فيه فيديو مرفوع: نولّد صورة غلاف تلقائياً من أول لقطة بالفيديو
      setStatus('🖼️ جاري إنشاء صورة غلاف من الفيديو...');
      try {
        const thumbFile = await generateVideoThumbnail(selectedVideoFile);
        const url = await uploadFileToGitHub(thumbFile, 'products', 'product');
        imageUrls.push(url);
      } catch (e) {
        // إذا فشل استخراج الغلاف لأي سبب، نكمل بدون صورة (fallback عند العرض للشعار الافتراضي)
      }
    }

    let videoUrl = '';
    if (videoMode === 'upload' && selectedVideoFile) {
      setStatus('🎬 جاري رفع الفيديو...');
      videoUrl = await uploadFileToGitHub(selectedVideoFile, 'products', 'video');
    } else if (videoMode === 'url') {
      videoUrl = document.getElementById('video-url-input').value.trim();
      if (imageUrls.length === 0) {
        // فيديو برابط خارجي بدون صور: نستخدم صورة افتراضية كغلاف لحين إضافة صورة لاحقاً
        imageUrls.push('https://placehold.co/400x400/1c1805/C8A96E?text=سالفورد');
      }
    }

    setStatus('📄 جاري تحديث قائمة المنتجات...');
    const current = await ghApi('products.json');
    if (!current.ok) throw new Error('تعذر قراءة products.json');
    const products = JSON.parse(decodeURIComponent(escape(atob(current.data.content.replace(/\n/g,'')))));

    if (!products[section]) products[section] = [];
    products[section].push({
      id: genProductId(),
      code: name,
      desc: notes || 'منتج جديد من سالفورد للأثاث والمفروشات',
      img: imageUrls[0] || 'https://placehold.co/400x400/1c1805/C8A96E?text=سالفورد',
      images: imageUrls,
      video: videoUrl,
      price: price,
      unit: unit
    });

    const newContent = btoa(unescape(encodeURIComponent(JSON.stringify(products, null, 2))));
    const push = await ghApi('products.json', 'PUT', {
      message: `إضافة منتج جديد: ${name}`,
      content: newContent,
      sha: current.data.sha,
      branch: GH_BRANCH
    });
    if (!push.ok) throw new Error(push.data.message || 'فشل حفظ المنتج');

    const alsoWork = document.getElementById('also-work-checkbox').checked;
    if (alsoWork) {
      setStatus('📸 جاري نشره أيضاً بقسم آخر أعمالنا...');
      const currentPosts = await ghApi('posts.json');
      if (currentPosts.ok) {
        const posts = JSON.parse(decodeURIComponent(escape(atob(currentPosts.data.content.replace(/\n/g,'')))));
        const today = new Date().toISOString().split('T')[0];
        posts.push({ id: 'post_' + Date.now(), title: name, desc: notes || '', img: imageUrls[0] || 'https://placehold.co/400x400/1c1805/C8A96E?text=سالفورد', images: imageUrls, video: videoUrl, date: today, price: price, unit: unit });
        const newPostsContent = btoa(unescape(encodeURIComponent(JSON.stringify(posts, null, 2))));
        await ghApi('posts.json', 'PUT', {
          message: `نشر تلقائي بقسم الأعمال: ${name}`,
          content: newPostsContent,
          sha: currentPosts.data.sha,
          branch: GH_BRANCH
        });
      }
    }

    setStatus('');
    showToast(alsoWork ? '✅ تمت إضافة المنتج ونشره بالأعمال أيضاً!' : '✅ تمت إضافة المنتج ونشره على الموقع فوراً!');
    document.getElementById('name-input').value = '';
    document.getElementById('price-input').value = '';
    document.getElementById('notes-input').value = '';
    document.getElementById('img-file').value = '';
    selectedImages = [];
    renderImageGrid();
    setVideoMode('none');
  } catch (e) {
    setStatus('');
    showToast('❌ ' + e.message, '#ff6b6b');
  } finally {
    btn.disabled = false;
  }
}
</script>
</body>
</html>
